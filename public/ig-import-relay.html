<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Importing examples</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14121c;
        color: #f5f2ea;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 30rem;
        border: 2px solid #3b3550;
        border-radius: 16px;
        background: #1c1928;
        padding: 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.1rem;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        line-height: 1.55;
        color: #cfc8bd;
        font-size: 0.95rem;
      }
      p + p {
        margin-top: 10px;
      }
      .bar {
        margin-top: 18px;
        height: 6px;
        border-radius: 999px;
        background: #2a2539;
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        width: 35%;
        border-radius: 999px;
        background: #ffb703;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      .bar[hidden] {
        display: none;
      }
      .ok { color: #86efac; }
      .bad { color: #fca5a5; }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }
      .actions:empty {
        margin-top: 0;
      }
      .actions a {
        border: 2px solid #3b3550;
        background: transparent;
        color: #f5f2ea;
        border-radius: 12px;
        padding: 9px 16px;
        font-size: 0.9rem;
        text-decoration: none;
      }
      .actions a:hover {
        border-color: #ffb703;
      }
      .actions a[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Style Transfer &middot; Instagram import</h1>
      <p id="status">Starting import&hellip;</p>
      <p id="detail" hidden></p>
      <div class="bar" id="bar"><span></span></div>
      <div class="actions">
        <a id="back" href="/" hidden>Open the app in this tab</a>
      </div>
    </main>
    <script>
      (function () {
        var MAX_IMPORT = 12;
        var TOKEN_RE = /^[a-f0-9]{64}$/;

        var statusEl = document.getElementById("status");
        var detailEl = document.getElementById("detail");
        var barEl = document.getElementById("bar");
        var backEl = document.getElementById("back");

        // Instagram's Content-Security-Policy blocks fetch to this origin, so
        // the snippet cannot post the images itself. Opening this tab is a
        // navigation, which CSP does not restrict, and from here the request is
        // same-origin. The tab that started the import polls the server for the
        // result, so it updates whether or not this tab is ever looked at.
        function setStatus(text, tone) {
          statusEl.textContent = text;
          statusEl.className = tone || "";
        }

        function setDetail(text) {
          if (!text) {
            detailEl.hidden = true;
            return;
          }
          detailEl.hidden = false;
          detailEl.textContent = text;
        }

        function stop(text, tone, detail) {
          barEl.hidden = true;
          backEl.hidden = false;
          setStatus(text, tone);
          setDetail(detail || "");
        }

        function readPayload() {
          var raw = (window.location.hash || "").replace(/^#/, "");
          // The token and signed CDN urls should not linger in history.
          try {
            window.history.replaceState(null, "", window.location.pathname);
          } catch (e) {}
          if (!raw) return null;
          try {
            var parsed = JSON.parse(decodeURIComponent(raw));
            if (!parsed || typeof parsed !== "object") return null;
            return parsed;
          } catch (e) {
            return null;
          }
        }

        function isCdnUrl(value) {
          try {
            var u = new URL(value);
            if (u.protocol !== "https:") return false;
            var h = u.hostname.toLowerCase();
            return (
              h === "cdninstagram.com" ||
              h.endsWith(".cdninstagram.com") ||
              h === "fbcdn.net" ||
              h.endsWith(".fbcdn.net")
            );
          } catch (e) {
            return false;
          }
        }

        function cleanList(value, limit, keep) {
          if (!Array.isArray(value)) return [];
          var out = [];
          var seen = {};
          for (var i = 0; i < value.length && out.length < limit; i += 1) {
            var entry = typeof value[i] === "string" ? value[i].trim() : "";
            if (!entry || seen[entry] || !keep(entry)) continue;
            seen[entry] = 1;
            out.push(entry);
          }
          return out;
        }

        var payload = readPayload();
        if (!payload) {
          stop(
            "Nothing to import.",
            "bad",
            "Open this page by running the import script on the Instagram profile tab."
          );
          return;
        }

        var token = typeof payload.token === "string" ? payload.token : "";
        if (!TOKEN_RE.test(token)) {
          stop(
            "This import is no longer authorized.",
            "bad",
            "Go back to the Style Transfer Playground, press Pull again, then re-run the script on the Instagram tab."
          );
          return;
        }

        var urls = cleanList(payload.urls, MAX_IMPORT, isCdnUrl);
        var codes = cleanList(payload.codes, MAX_IMPORT, function (v) {
          return /^[A-Za-z0-9_-]{5,64}$/.test(v);
        });

        if (urls.length === 0) {
          stop(
            "No usable images were found in that payload.",
            "bad",
            "Re-run the import script on the Instagram profile tab."
          );
          return;
        }

        setStatus(
          "Importing " + urls.length + " image" + (urls.length === 1 ? "" : "s") + "\u2026"
        );
        setDetail("Downloading and storing images. Keep this tab open.");

        fetch("/api/feed-import", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, codes: codes, urls: urls }),
        })
          .then(function (response) {
            return response
              .json()
              .catch(function () {
                return {};
              })
              .then(function (data) {
                return { ok: response.ok, status: response.status, data: data };
              });
          })
          .then(function (result) {
            var data = result.data || {};
            if (data.projectId) {
              backEl.setAttribute(
                "href",
                "/?project=" + encodeURIComponent(data.projectId)
              );
            }
            if (!result.ok) {
              stop(data.error || "Could not import those images.", "bad");
              return;
            }
            var n = data.imported || urls.length;
            stop(
              "Imported " + n + " image" + (n === 1 ? "" : "s") + ".",
              "ok",
              "Switch back to your Style Transfer tab \u2014 they are already there. You can close this tab."
            );
          })
          .catch(function () {
            stop(
              "Could not reach the Style Transfer server.",
              "bad",
              "Check that the app is still running, then press Pull and re-run the script."
            );
          });
      })();
    </script>
  </body>
</html>
